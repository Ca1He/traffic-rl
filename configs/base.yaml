# Default configuration. Experiment configs override only what they change.

env:
  scenario: asym          # balanced | asym | surge | random (random = domain randomization pool)
  num_seconds: 3600       # episode length (s)
  delta_time: 5           # seconds between decisions
  yellow_time: 3
  min_green: 10
  max_green: 60           # enforced by MaxGreenWrapper (sumo-rl ignores it)
  reward: diff-waiting-time   # diff-waiting-time | queue | pressure | fair-shaped
  fair_alpha: 1.0         # fair-shaped only: weight of the long-wait penalty
  fair_tau: 60            # fair-shaped only: time scale (s)
  gui: false

cost:
  kind: indicator         # indicator: 1[max wait > T];  hinge: max(0, max wait - T) / T
  threshold: 90           # T (s)
  structural_max_red: null  # if set (s): train on the structural cost 1[some phase red > R] instead

lagrangian:               # PPO-Lagrangian (agents/lagrangian.py); PPO only
  enabled: false
  target: 0.05            # d: allowed violation rate (mean per-step cost)
  lr: 0.01                # dual step size eta (0.05 overshoots: lambda ~1.1, over-constrained)
  lam_init: 0.0
  lam_max: 20.0
  fixed: null             # constant lambda instead of the dual update (reward-shaping ablation)

sensing:
  noise_std: 0.0          # Gaussian noise on normalized detector readings
  dropout_p: 0.0          # probability a lane detector reads 0
  dropout_mode: step      # step (transient) | episode (persistent failure)
  dropout_p_max: 0.0      # domain randomization: dropout_p ~ U[0, max] per episode
  noise_std_max: 0.0      # domain randomization: noise_std ~ U[0, max] per episode

demand_randomization: false
random_pool:
  n: 50
  low: 100
  high: 850
  seed: 12345
